<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- App tile. Flat #409EFF (Element Plus primary) rather than the old gradient: the tile has to
       read as the same brand colour as the workbench topbar and the two sibling extensions. -->
  <rect width="32" height="32" rx="7" fill="#409EFF"/>

  <!--
    Bold swap arrows: stays legible at 16px. This is the brand mark and the geometry source of
    truth — `icon.svg` reuses it (scaled + colour-inverted) inside its badge, so change the
    arrow shape here and mirror it there, never the other way round.
  -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
    <line x1="8" y1="12" x2="18" y2="12"/>
    <line x1="24" y1="20" x2="14" y2="20"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M18 7 L26 12 L18 17 Z"/>
    <path d="M14 15 L6 20 L14 25 Z"/>
  </g>
</svg>
