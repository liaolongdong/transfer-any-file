<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Document sheet with folded corner -->
  <path d="M34 20 H62 L78 36 V86 Q78 92 72 92 H34 Q28 92 28 86 V26 Q28 20 34 20 Z" fill="#FFFFFF"/>
  <path d="M62 20 V32 Q62 36 66 36 H78 Z" fill="#BFDBFE"/>
  <rect x="38" y="46" width="24" height="5" rx="2.5" fill="#93C5FD"/>
  <rect x="38" y="58" width="28" height="5" rx="2.5" fill="#93C5FD"/>
  <rect x="38" y="70" width="14" height="5" rx="2.5" fill="#93C5FD"/>

  <!--
    Conversion badge: the *same* bidirectional swap mark as `icon-small.svg`, scaled 1.7x into
    the disc and colour-inverted (blue on white instead of white on blue). Reusing the small
    tier's geometry is what makes the 16px toolbar icon and the 128px store icon read as one
    logo; the previous Material `autorenew` ring read as "refresh" instead of "convert".
  -->
  <circle cx="88" cy="88" r="27" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5"/>
  <g transform="translate(60.8 60.8) scale(1.7)">
    <g stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round">
      <line x1="8" y1="12" x2="18" y2="12"/>
      <line x1="24" y1="20" x2="14" y2="20"/>
    </g>
    <g fill="#1D4ED8">
      <path d="M18 7 L26 12 L18 17 Z"/>
      <path d="M14 15 L6 20 L14 25 Z"/>
    </g>
  </g>
</svg>
