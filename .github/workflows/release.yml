# 从版本 tag 构建一次发布：扩展产物 → 商店 zip → 包内容校验 → 附带该 zip 的 GitHub Release。
# 最后一步把同一个 zip 交给 Chrome 应用商店，但只在 CHROME_* 四项 secrets 齐备之后——第一个商店
# 条目必须在开发者后台手工创建（见 CHROMEWEBSTORE.md），在那之前这一步只报告跳过原因，不让发布失败。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.0.0'
        required: true
        type: string
      dry_run:
        description: 'Build and verify everything, but create no release and submit nothing'
        required: false
        type: boolean
        default: true

# 用 `gh release create` 而不是第三方 action：本项目的全部主张就是「没有外部东西碰你的构建」，
# 所以发布路径只用 runner 自带的 CLI。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # tag、manifest 版本与商店包三者永远不许不一致。
      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$REF_NAME"
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' 不是 v 前缀的版本 tag"; exit 1 ;;
          esac
          version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::tag '$tag' 是 $version，但 package.json 是 $pkg_version —— 只升其中一个不行"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先跑便宜的守卫：它们正是商店文案与隐私政策里反复出现的那几条断言。
      # 离线检查此处只到源码层——产物层要用 .output/chrome-mv3，放在 Build 之后。
      - name: Verify metadata and offline guarantee (source)
        run: |
          pnpm verify:meta
          pnpm verify:offline:source
          pnpm verify:listing

      - name: Build
        run: pnpm build

      # 打包/发布之前必须确认浏览器实际加载的那份 manifest 只持有 storage：
      # 这是唯一能拦住 WXT 模块或 manifest transform 偷偷加权限的检查，而它只有产物存在时才跑得动。
      - name: Verify offline (built manifest)
        run: pnpm verify:offline

      - name: Package
        id: package
        run: |
          pnpm package
          zip="$(ls .output/*-"$VERSION"-chrome.zip 2>/dev/null | head -1)"
          if [ -z "$zip" ]; then
            echo "::error::wxt zip 没有产出 .output/*-$VERSION-chrome.zip（artifactTemplate 命名为 {{name}}-{{packageVersion}}-{{browser}}.zip）"
            ls -la .output || true
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # zip 必须能作为「加载未打包的扩展」直接载入：manifest.json 位于压缩包根目录，
      # 且不许有仓库文档或测试夹具混进来（CHROMEWEBSTORE.md 的检查清单）。
      - name: Verify package contents
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          entries="$(unzip -Z1 "$ZIP")"
          echo "$entries" | sed 's/^/  /'
          echo "$entries" | grep -qx 'manifest.json' || {
            echo "::error::manifest.json 必须位于 $ZIP 的根目录"; exit 1;
          }
          if echo "$entries" | grep -qE '^(docs/|fixtures/|scripts/|components/|composables/|utils/|entrypoints/|CHROMEWEBSTORE\.md|README|AGENTS\.md|CLAUDE\.md|\.test-)'; then
            echo "::error::商店包里只能有构建产物，上面列出了混入的仓库文件"
            exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 发布说明取中文主文件；遇到下一个 `## ` 标题或更新日志页脚即停止
          # （链接定义与末尾注释不属于发布说明）。两份的区块标题同为 `## [X.Y.Z]`，awk 与语言无关。
          awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 {keep = 1; next} keep && (/^## / || /^<!--/) {keep = 0} keep' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '完整发布说明见仓库内的 CHANGELOG.md（中文）与 CHANGELOG.en.md（英文）。\n' > release-notes.md
          fi

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          {
            printf '\n---\n\n英文更新日志见仓库内的 [`CHANGELOG.en.md`](https://github.com/liaolongdong/transfer-any-file/blob/%s/CHANGELOG.en.md)。附件 `*.zip` 即 Chrome 应用商店包，也可在 `chrome://extensions` 解压后以「加载未打包的扩展」使用。\n' "$TAG"
          } >> release-notes.md
          gh release create "$TAG" "$ZIP" \
            --title "Transfer Any File $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Report dry run
        if: github.event.inputs.dry_run == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          {
            echo '### Dry run —— 什么都没发布'
            echo
            echo "- Tag：\`$TAG\`（与 package.json 版本一致）"
            echo "- 产物包：\`$ZIP\`（$(du -h "$ZIP" | cut -f1)），manifest.json 在压缩包根目录，内部没有仓库文件"
            echo "- 将会创建的 Release：\`Transfer Any File $VERSION\`，附带该 zip"
            echo "- 发布说明：\`CHANGELOG.md\` 里的 \`## [$VERSION]\` 区块"
          } >> "$GITHUB_STEP_SUMMARY"

      # 在开发者后台出现第一个条目之前始终是休眠状态；`publish-extension` 既建不了条目，
      # 也填不了商品文案、截图和隐私申报。
      - name: Detect Chrome Web Store credentials
        id: store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID_TAF }}
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_CLIENT_ID" ] && [ -n "$CHROME_CLIENT_SECRET" ] && [ -n "$CHROME_REFRESH_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '### 已跳过 Chrome 应用商店提交'
              echo
              echo '四项 secrets 必须全部配置（Settings → Secrets and variables → Actions）：'
              echo '`CHROME_EXTENSION_ID_TAF`（本扩展专用）、`CWS_CLIENT_ID`、`CWS_CLIENT_SECRET`、`CWS_REFRESH_TOKEN`。'
              echo
              echo '第一个版本同样要手工创建并手工提交——API 建不了条目，也填不了商品文案、截图和隐私申报。'
              echo '手工步骤见 CHROMEWEBSTORE.md。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ──────────────────────────────────────────────────────────────
      # Chrome Web Store auto-publish
      # 需要在 GitHub repo Settings → Secrets and variables → Actions 中配置：
      #   CHROME_EXTENSION_ID_TAF — Transfer Any File 扩展 ID（从 CWS Dashboard 获取）
      #   CWS_CLIENT_ID           — Google Cloud OAuth 2.0 Client ID（与 account-password-helper 共用）
      #   CWS_CLIENT_SECRET       — Google Cloud OAuth 2.0 Client Secret（与 account-password-helper 共用）
      #   CWS_REFRESH_TOKEN       — OAuth 2.0 Refresh Token（与 account-password-helper 共用）
      # ──────────────────────────────────────────────────────────────
      # wxt-publish-extension 的 --chrome-zip 不支持 glob 通配符，
      # 会将 ".output/*-chrome.zip" 当作字面文件名打开而报 ENOENT。
      # 因此先解析出实际的 zip 路径（取最新构建产物），再传入发布步骤。
      - name: Resolve extension zip path
        if: steps.store.outputs.ready == 'true'
        id: cws_zip
        run: |
          ZIP_PATH="$(ls -t .output/*-chrome.zip | head -n1)"
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved Chrome zip: $ZIP_PATH"

      # 校验 CWS OAuth 凭据：用 refresh_token 换取 access_token。
      # wxt-publish-extension 上传前会先做此交换，返回 400 通常意味着：
      #   - invalid_grant：refresh token 过期/被撤销（OAuth 应用处于 Testing 模式时约 7 天过期，最常见）
      #   - invalid_client：client id/secret 与该 refresh token 不是同一套
      # 本步骤把不透明的 400 转成明确错误信息；仅打印错误体，绝不打印 access_token。
      - name: Verify CWS OAuth credentials
        if: steps.store.outputs.ready == 'true'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o token_resp.json -w '%{http_code}' \
            --data-urlencode "client_id=$CHROME_CLIENT_ID" \
            --data-urlencode "client_secret=$CHROME_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CHROME_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "OAuth credentials OK（已获取 access_token，不打印）。若发布仍报 400，问题在扩展条目状态/版本号/包内容，而非凭据。"
            rm -f token_resp.json
          else
            echo "OAuth token exchange failed，HTTP $HTTP_CODE："
            cat token_resp.json
            echo ""
            echo "修复：重新走 OAuth 授权流程生成新的 refresh token，将 client-id/secret/refresh-token 作为同一套更新到仓库 Secrets；并把 OAuth 应用发布为 In production 以避免 token 过期。"
            rm -f token_resp.json
            exit 1
          fi

      # 校验扩展 ID 格式：CWS 扩展 ID 必须是 32 位 a-p 小写字母。
      # Secret 值若混入空格/换行等不可见字符，上传 URL 会变形导致 Google 返回 404，
      # 且该问题不会被 OAuth 凭据校验步骤拦截，故在发布前显式校验并给出明确错误。
      - name: Verify CWS extension id format
        if: steps.store.outputs.ready == 'true'
        run: |
          if printf '%s' "$CHROME_EXTENSION_ID" | grep -qE '^[a-p]{32}$'; then
            echo "CHROME_EXTENSION_ID_TAF 格式 OK（32 位 a-p 字母）。"
          else
            echo "CHROME_EXTENSION_ID_TAF 格式非法：应为 32 位 a-p 小写字母，实际长度 $(printf '%s' "$CHROME_EXTENSION_ID" | wc -c | tr -d ' ')。"
            echo "多为复制时带入了空格/换行，请在仓库 Secrets 中重新粘贴纯净的扩展 ID。"
            exit 1
          fi

      - name: Submit to the Chrome Web Store
        if: steps.store.outputs.ready == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ZIP: ${{ steps.cws_zip.outputs.path }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID_TAF }}
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          # 命令行上只传非密参数：publish-extension 会从同名的大写下划线环境变量读取每个 flag，
          # 这样 refresh token 不会出现在进程参数列表里。
          pnpm exec wxt-publish-extension \
            --chrome-zip "$ZIP" \
            --chrome-publish-target default
