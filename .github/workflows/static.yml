# 把产品说明页部署到 GitHub Pages。
#
# 产物根是 `docs/`，**不是仓库根**：本项目对外发布的每一个 URL 都是按「站点根」写的——
# docs/index.html 里的 canonical / OG / JSON-LD 区块、docs/sitemap.xml、docs/robots.txt、
# docs/llms.txt，以及 CHROMEWEBSTORE.md 里的隐私政策 URL。若改成发布仓库根，`<site>/` 与
# `<site>/privacy.html` 会一起变 404，而这会直接卡住 Chrome 应用商店提交——后台要求一个
# 可访问的政策 URL。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/static.yml'

  # 允许从 Actions 标签页手工触发一次
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署：排队中比它更新的运行可以跳过，但正在跑的运行不许被取消——
# 生产部署要让它跑完。
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 只是发布静态文件，所以单个部署 job 就够
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 未发布的推广稿放在 docs/promo/（按 AGENTS.md，它们只留在仓库里，永不发布）；
      # docs/ 下其余的都是站点本身。内部运营文档（商店手册、上架 runbook）不属于站点，
      # 一律放 `.github/`——放在 docs/ 下就会被这个工作流原样发到公网。
      - name: Stage site
        run: rsync -a --exclude 'promo/' docs/ _site/

      # 宁可在这里失败，也不要部署出一个让项目其余链接指向的页面 404 的产物。
      - name: Verify staged site
        run: |
          for f in index.html privacy.html .nojekyll; do
            test -f "_site/$f" || { echo "::error::_site/$f 缺失"; exit 1; }
          done
          test ! -e _site/promo || { echo "::error::docs/promo 草稿不许被发布"; exit 1; }
          # 站点是 HTML + 纯文本 + 素材；出现 `.md` 就说明有人把仓库文档放进了 docs/。
          # 单靠 `promo` 一条黑名单挡不住新的一类，所以改成按扩展名兜底。
          if md="$(find _site -name '*.md' -print)"; [ -n "$md" ]; then
            echo "::error::docs/ 里的 Markdown 不属于站点，请移到 .github/："
            printf '%s\n' "$md"
            exit 1
          fi

          # sitemap 是搜索引擎唯一被允许来抓的那份清单，也是「站点根」这套 URL 约定的清单化；
          # 里面每一条 <loc> 都必须在 staging 里真的有对应文件。这条检查只读 XML 和磁盘，
          # 不装依赖、不构建，所以它是这份部署前置里唯一付得起的「断链」守卫 —— pages:check
          # 与 verify:numbers 都在 ci.yml 的另一条 job 里，和这里没有 needs 关系。
          if [ -f _site/sitemap.xml ]; then
            bad=0
            while IFS= read -r loc; do
              rel="$(printf '%s' "$loc" | sed -e 's#^https\{0,1\}://[^/]*/transfer-any-file##')"
              case "$rel" in
                /) cand='_site/index.html' ;;
                */) cand="_site${rel}index.html" ;;
                *) cand="_site${rel}" ;;
              esac
              if [ ! -f "$cand" ]; then
                echo "::error::sitemap 指向的页面不在站点里：$loc → ${cand#_site/}"
                bad=1
              fi
            done < <(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' _site/sitemap.xml)
            if [ "$bad" -ne 0 ]; then
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传站点目录本身，于是 docs/index.html 就成了站点根
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
