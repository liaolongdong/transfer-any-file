name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 只需要读仓库内容；显式收紧默认 token，防止依赖脚本拿到写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:all
      # 对外元数据：package.json / wxt.config.ts / .github/repo-metadata.json 三者必须一致
      - run: pnpm verify:meta
      # 每一份文档都在重复的那句隐私承诺：第一方源码里没有网络调用、manifest 源只要 storage。
      # 这里只跑源码层——本 job 在干净检出上先于任何 build，产物层断言在 build job 里执行。
      - run: pnpm verify:offline:source
      # 远程托管代码：源码层先筛掉我们自己写进去的那类形状（同样只有这一步能在无产物时跑）。
      - name: Verify no remotely hosted code (source)
        run: pnpm verify:remote-code:source
      # 转换路径快照：等长路由由哪条 register() 先注册决定，注册顺序一变就必须显式更新基线。
      # 纯静态解析源码，不需要产物，所以和上面的源码层守卫放在同一个 job。
      - name: Verify conversion paths
        run: pnpm verify:paths
      # 对外散文里的数字必须等于代码里的那一个：格式数、路径数、闭包与屏蔽数、各类阈值，
      # 全部从源码与路径基线现推。跑的是同一条静态路线，因此也放在 build 之前。
      - name: Verify prose numbers
        run: pnpm verify:numbers
      # 商店后台的每个粘贴字段都在字数上限内，且与 manifest 一致
      - run: pnpm verify:listing

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 产物层守卫：浏览器实际加载的那份 manifest 只允许 storage。WXT 模块或 manifest transform
      # 会加上源码配置里从未出现的权限，只有这一步能发现——缺 .output 时脚本直接失败，不再静默跳过。
      - name: Verify offline (built manifest)
        run: pnpm verify:offline
      # 源码层筛不掉的是第三方依赖：jsPDF 的 cdnjs script 注入与 pdf.js 那份「把 import 拼成文本再
      # 交给 Worker」的包装器，只在压缩产物里。构建期插件删掉它们，这一步是「确实删掉了」的唯一断言。
      - name: Verify no remotely hosted code (built bundle)
        run: pnpm verify:remote-code

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - run: node scripts/e2e-test.mjs
        env:
          CI: 'true'
          E2E_SCREENSHOT_DIR: ${{ github.workspace }}/.test-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: .test-screenshots/
          retention-days: 7
