name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 只需要读仓库内容；显式收紧默认 token，防止依赖脚本拿到写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:all
      # 对外元数据：package.json / wxt.config.ts / .github/repo-metadata.json 三者必须一致
      - run: pnpm verify:meta
      # 每一份文档都在重复的那句隐私承诺：第一方源码里没有网络调用
      - run: pnpm verify:offline
      # 商店后台的每个粘贴字段都在字数上限内，且与 manifest 一致
      - run: pnpm verify:listing

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - run: node scripts/e2e-test.mjs
        env:
          CI: 'true'
          E2E_SCREENSHOT_DIR: ${{ github.workspace }}/.test-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: .test-screenshots/
          retention-days: 7
