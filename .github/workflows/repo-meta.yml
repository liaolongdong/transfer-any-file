# 把 .github/repo-metadata.json 应用到仓库的 About 块：描述、网站链接与 topics 列表。一个新仓库在
# GitHub 搜索里的覆盖面来自这几个字段而不是它的 slug，所以它们被版本化在这里，而不是散落在设置页里。
#
# 为什么必须用个人访问令牌：仓库元数据在 repository *administration* 作用域后面，而 administration
# 不在工作流能用内置 GITHUB_TOKEN 申请到的权限列表里——那个调用会答 403
# "Resource not accessible by integration"。请建一把只限本仓库、Administration: read and write 的
# fine-grained token（承载 PATCH /repos/{owner}/{repo}，含 `topics`），存为 `REPO_METADATA_TOKEN`
# secret。一次性的本地替代方案见 `.github/repo-metadata.md`（两条路径与校验命令都在那里）。
name: Sync repository metadata

on:
  push:
    # 有意限定在默认分支：这个 job 写入的是一个线上、公开的仓库设置，所以其它分支上对这个 JSON 文件的
    # 实验性改动不该被应用出去。
    branches: [main]
    paths:
      - '.github/repo-metadata.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-meta
  cancel-in-progress: false

jobs:
  sync:
    name: Apply description, website and topics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 每次写入都会整表替换 topics，所以一个格式错误或只有一半的文件必须在这里就停下，
      # 而不是静默删掉那些花力气攒起来的 topic。
      - name: Validate metadata
        run: |
          jq -e 'has("description") and has("homepage") and (.topics | type == "array" and length > 0)' \
            .github/repo-metadata.json > /dev/null || { echo '::error::.github/repo-metadata.json 需要 description、homepage 和一个非空的 topics 数组'; exit 1; }
          # jq 按字符计数，与 GitHub 上限的定义方式一致；`${#var}` 在 C locale 下按字节数，
          # 会和 `pnpm verify:meta` 对不上。
          description_chars="$(jq -r '.description | length' .github/repo-metadata.json)"
          if [ "$description_chars" -gt 350 ]; then
            echo "::error::About 描述有 $description_chars 个字符，GitHub 的上限是 350"
            exit 1
          fi
          while IFS= read -r topic; do
            if ! printf '%s' "$topic" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "::error::'$topic' 不是合法的 GitHub topic（小写字母数字、单个连字符分隔、首尾都不许是连字符）"
              exit 1
            fi
          done < <(jq -r '.topics[]' .github/repo-metadata.json)

      - name: Apply to the repository
        env:
          TOKEN: ${{ secrets.REPO_METADATA_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::尚未配置 REPO_METADATA_TOKEN secret——见本文件头部注释，或手工把值填进去（Settings → General → About，或用 .github/repo-metadata.md 里的一次性 curl）"
            exit 1
          fi
          body="$(jq -c '{description, homepage, topics}' .github/repo-metadata.json)"
          response="$(mktemp)"
          # `|| true` 是为了把传输失败留给下面的 `if` 判断，而不是在 runner 的 `bash -e` 下直接中断
          # 这一步；收不到响应时 curl 报 "000"。
          status="$(curl -sS -o "$response" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "$body" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" || true)"
          if [ "${status:-000}" != '200' ]; then
            echo "::error::GitHub 没有接受这次元数据更新（HTTP ${status:-000}）"
            cat "$response"
            printf '\n承载这个端点的作用域是 Administration: read and write；只有当 GitHub 额外报缺 Contents 时才需要授予它。\n'
            printf '用内置的 GITHUB_TOKEN 调同一个端点会答 403 "Resource not accessible by integration"。\n'
            exit 1
          fi
          {
            echo '### 仓库 About 块已更新'
            echo
            jq -r '"- description: \(.description) (\(.description | length) chars)", "- website: \(.homepage)", "- topics (\(.topics | length)): \(.topics | join(", "))"' .github/repo-metadata.json
          } >> "$GITHUB_STEP_SUMMARY"
