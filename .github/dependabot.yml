version: 2

# 依赖升级的策略与 `AGENTS.md`「改动优先级」那条一致（未经用户明确要求不升级依赖）：机器人只负责
# 把补丁与小版本递到 PR 里，大版本一律留给人判断（重型转换库——jspdf / pdfjs-dist / xlsx /
# mammoth / marked / turndown——一次大版本改动可能改的是转换产物的大小与结构，而那正是 e2e 在读的东西）。
# 这条 ignore 是这份配置里唯一有牙齿的行，删掉它等于把「顺手升大版本」重新变成默认。
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: sunday
      time: '18:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # 四条工作流（ci / release / repo-meta / static）只会以「CI 突然红了」的形式暴露 runner 镜像或
  # action 大版本的漂移，所以这一项比依赖那项更便宜，也不需要 ignore 大版本。
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - ci
